<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 475" role="img" aria-labelledby="t d" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title id="t">TraderCalc: our definition of a trader</title>
<desc id="d">Anyone doing business or anyone intending to do business. Know your profit. Protect your margin.</desc>
<rect x="0" y="0" width="380" height="475" fill="#0B3D2E"/>
<rect x="24" y="36" width="112" height="28" rx="14" fill="#F5B301"/>
<text x="80" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#0B3D2E">TraderCalc</text>
<text x="24" y="128" font-size="20" fill="#FFF6E0">Our definition of</text>
<text x="24" y="178" font-size="44" font-weight="bold" fill="#F5B301">a trader</text>
<rect x="24" y="208" width="332" height="150" rx="16" fill="#FFF6E0"/>
<text x="190" y="245" text-anchor="middle" font-size="21" font-weight="bold" fill="#0B3D2E">Anyone doing business</text>
<text x="190" y="275" text-anchor="middle" font-size="14" fill="#8A6100">or</text>
<text x="190" y="305" text-anchor="middle" font-size="21" font-weight="bold" fill="#0B3D2E">anyone intending</text>
<text x="190" y="335" text-anchor="middle" font-size="21" font-weight="bold" fill="#0B3D2E">to do business!</text>
<text x="190" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#F5B301">Know your profit. Protect your margin.</text>
</svg>
